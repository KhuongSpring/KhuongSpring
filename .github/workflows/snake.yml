name: Generate Snake

on:
  # Chạy tự động mỗi 24 giờ (vào lúc nửa đêm)
  schedule:
    - cron: "0 0 * * *" 
  
  # Cho phép chạy thủ công bất cứ lúc nào
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # Tên username của bạn (thay thế bằng username thật nếu cần, hoặc để github.repository_owner)
          github_user_name: ${{ KhuongSpring }}
          
          # Danh sách các file ảnh sẽ được tạo ra (bao gồm cả chế độ sáng và tối)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}