name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Metrics - overview (achievements, notable)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KhuongSpring
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          filename: metrics.overview.svg
          committer_branch: metrics-output
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 6
          plugin_notable: yes
          plugin_notable_indepth: yes

      - name: Metrics - languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KhuongSpring
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          filename: metrics.languages.svg
          committer_branch: metrics-output
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

      - name: Metrics - habits and lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KhuongSpring
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          filename: metrics.habits.svg
          committer_branch: metrics-output
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_lines: yes
          plugin_lines_sections: base

      - name: Metrics - isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KhuongSpring
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          filename: metrics.isocalendar.svg
          committer_branch: metrics-output
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics - skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KhuongSpring
          template: classic
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          filename: metrics.skyline.svg
          committer_branch: metrics-output
          plugin_skyline: yes
